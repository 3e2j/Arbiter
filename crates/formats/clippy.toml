# Adds byte-order bans for formats

avoid-breaking-exported-api = false
doc-valid-idents = ["GameCube", ".."]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
    # The GameCube and Wii are big-endian. Native-endian conversions silently do
    # the right thing on a BE host and the wrong thing everywhere else, so all
    # format code states its byte order.
    { path = "u16::from_ne_bytes", reason = "GameCube data is big-endian", replacement = "u16::from_be_bytes" },
    { path = "u16::to_ne_bytes", reason = "GameCube data is big-endian", replacement = "u16::to_be_bytes" },
    { path = "u32::from_ne_bytes", reason = "GameCube data is big-endian", replacement = "u32::from_be_bytes" },
    { path = "u32::to_ne_bytes", reason = "GameCube data is big-endian", replacement = "u32::to_be_bytes" },
    { path = "u64::from_ne_bytes", reason = "GameCube data is big-endian", replacement = "u64::from_be_bytes" },
    { path = "u64::to_ne_bytes", reason = "GameCube data is big-endian", replacement = "u64::to_be_bytes" },
    { path = "i16::from_ne_bytes", reason = "GameCube data is big-endian", replacement = "i16::from_be_bytes" },
    { path = "i16::to_ne_bytes", reason = "GameCube data is big-endian", replacement = "i16::to_be_bytes" },
    { path = "i32::from_ne_bytes", reason = "GameCube data is big-endian", replacement = "i32::from_be_bytes" },
    { path = "i32::to_ne_bytes", reason = "GameCube data is big-endian", replacement = "i32::to_be_bytes" },
    { path = "i64::from_ne_bytes", reason = "GameCube data is big-endian", replacement = "i64::from_be_bytes" },
    { path = "i64::to_ne_bytes", reason = "GameCube data is big-endian", replacement = "i64::to_be_bytes" },
    { path = "f32::from_ne_bytes", reason = "GameCube data is big-endian", replacement = "f32::from_be_bytes" },
    { path = "f32::to_ne_bytes", reason = "GameCube data is big-endian", replacement = "f32::to_be_bytes" },
    { path = "f64::from_ne_bytes", reason = "GameCube data is big-endian", replacement = "f64::from_be_bytes" },
    { path = "f64::to_ne_bytes", reason = "GameCube data is big-endian", replacement = "f64::to_be_bytes" },
]
